# ==============================================================================================
# fleet-lambda — complete Lambda-architecture stack, laptop sized (target <= 8 GB Docker memory).
#
# Layout of the file: infrastructure (kafka, postgres) -> ingestion (producers) -> processing
# (stream job) -> orchestration (airflow) -> serving (api) -> observability (exporter,
# prometheus, grafana) -> tooling (tests).
#
# Two conventions worth knowing before reading on:
#   * Every long-running service declares a `healthcheck`, and dependants use
#     `condition: service_healthy`.  Start-up order in a Lambda stack is genuinely load bearing:
#     the stream job cannot create its Kafka consumer before the topic exists.
#   * `mem_limit` is set on every service.  The numbers below total ~5.8 GB and were TUNED
#     from a real measurement (TC-NFR-003): the Airflow webserver was peaking at 89% of its
#     limit while Postgres, Prometheus, the API and the exporter all sat under 30%, so the
#     slack was moved to where it was actually needed.  This leaves
#     head-room inside an 8 GB Docker VM.  Without limits, Spark's JVM will happily take the lot
#     and the OOM killer picks off Postgres.
# ==============================================================================================

x-app-env: &app-env
  # Every service reads the same .env, so there is exactly one source of configuration truth.
  SIM_DAY_SECONDS: ${SIM_DAY_SECONDS}
  SIM_START_DATE: ${SIM_START_DATE}
  SIM_EPOCH_FILE: ${SIM_EPOCH_FILE}
  SEED: ${SEED}
  KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP}
  KAFKA_TOPIC: ${KAFKA_TOPIC}
  KAFKA_DLQ_TOPIC: ${KAFKA_DLQ_TOPIC}
  KAFKA_PARTITIONS: ${KAFKA_PARTITIONS}
  KAFKA_REPLICATION: ${KAFKA_REPLICATION}
  KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP}
  POSTGRES_HOST: ${POSTGRES_HOST}
  POSTGRES_PORT: ${POSTGRES_PORT}
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  NUM_VEHICLES: ${NUM_VEHICLES}
  EMIT_INTERVAL_SEC: ${EMIT_INTERVAL_SEC}
  EMIT_JITTER_SEC: ${EMIT_JITTER_SEC}
  LAZY_VEHICLES: ${LAZY_VEHICLES}
  BAD_EVENT_RATE: ${BAD_EVENT_RATE}
  LATE_EVENT_RATE: ${LATE_EVENT_RATE}
  DUPLICATE_RATE: ${DUPLICATE_RATE}
  LATE_EVENT_MIN_SEC: ${LATE_EVENT_MIN_SEC}
  LATE_EVENT_MAX_SEC: ${LATE_EVENT_MAX_SEC}
  FARE_BASE_LKR: ${FARE_BASE_LKR}
  FARE_PER_KM_LKR: ${FARE_PER_KM_LKR}
  FARE_NOISE_PCT: ${FARE_NOISE_PCT}
  EXPENSE_FUEL_PER_KM_LKR: ${EXPENSE_FUEL_PER_KM_LKR}
  EXPENSE_DISTANCE_MIN_KM: ${EXPENSE_DISTANCE_MIN_KM}
  EXPENSE_DISTANCE_MAX_KM: ${EXPENSE_DISTANCE_MAX_KM}
  EXPENSE_MAINT_NORMAL_MIN: ${EXPENSE_MAINT_NORMAL_MIN}
  EXPENSE_MAINT_NORMAL_MAX: ${EXPENSE_MAINT_NORMAL_MAX}
  EXPENSE_MAINT_HIGH_MIN: ${EXPENSE_MAINT_HIGH_MIN}
  EXPENSE_MAINT_HIGH_MAX: ${EXPENSE_MAINT_HIGH_MAX}
  EXPENSE_HIGH_COST_PCT: ${EXPENSE_HIGH_COST_PCT}
  EXPENSE_DIRTY_ROWS: ${EXPENSE_DIRTY_ROWS}
  ZONE_LAT_MIN: ${ZONE_LAT_MIN}
  ZONE_LAT_MAX: ${ZONE_LAT_MAX}
  ZONE_LON_MIN: ${ZONE_LON_MIN}
  ZONE_LON_MAX: ${ZONE_LON_MAX}
  SPARK_MASTER: ${SPARK_MASTER}
  STREAM_STARTING_OFFSETS: ${STREAM_STARTING_OFFSETS}
  STREAM_WINDOW_MINUTES: ${STREAM_WINDOW_MINUTES}
  STREAM_WATERMARK_MINUTES: ${STREAM_WATERMARK_MINUTES}
  STREAM_TRIGGER_SECONDS: ${STREAM_TRIGGER_SECONDS}
  CHECKPOINT_ROOT: ${CHECKPOINT_ROOT}
  LAKE_ROOT: ${LAKE_ROOT}
  LANDING_DIR: ${LANDING_DIR}
  PROCESSED_DIR: ${PROCESSED_DIR}
  REPORTS_DIR: ${REPORTS_DIR}
  IDLE_ALERT_MINUTES: ${IDLE_ALERT_MINUTES}
  MARGIN_THRESHOLD: ${MARGIN_THRESHOLD}
  FRESHNESS_SECONDS: ${FRESHNESS_SECONDS}
  MAX_BAD_EXPENSE_ROW_PCT: ${MAX_BAD_EXPENSE_ROW_PCT}
  API_PORT: ${API_PORT}
  PRODUCER_METRICS_PORT: ${PRODUCER_METRICS_PORT}
  EXPENSE_METRICS_PORT: ${EXPENSE_METRICS_PORT}
  STREAM_METRICS_PORT: ${STREAM_METRICS_PORT}
  LOG_LEVEL: ${LOG_LEVEL}
  LOG_FORMAT: ${LOG_FORMAT}
  SKIP_DAY: ${SKIP_DAY:-}

x-logging: &default-logging
  # Cap log files so a long demo cannot fill the disk; json-file keeps `docker logs | jq` working.
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  # ==========================================================================================
  # INFRASTRUCTURE
  # ==========================================================================================
  kafka:
    image: apache/kafka:3.7.1
    container_name: fleet-kafka
    hostname: kafka
    # KRaft mode: no ZooKeeper. One node plays both broker and controller roles, which is the
    # single-broker simplification documented as a limitation in the report (no replication).
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      # Two advertised listeners: `kafka:9092` for containers, `localhost:29092` so a developer
      # on the host can point kafka-console-consumer at the same broker.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: ${KAFKA_PARTITIONS}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: fleet-lambda-cluster-0001
      KAFKA_HEAP_OPTS: "-Xmx400m -Xms256m"
    ports:
      - "29092:29092"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    mem_limit: 700m
    logging: *default-logging
    restart: unless-stopped

  # One-shot: creates the telemetry topic with 6 partitions and the DLQ topic, then exits.
  # Topic creation is explicit (auto-create is off) because partition count is an architectural
  # decision, not something to leave to a default.
  kafka-init:
    image: apache/kafka:3.7.1
    container_name: fleet-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scripts/create_topics.sh"]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC}
      KAFKA_DLQ_TOPIC: ${KAFKA_DLQ_TOPIC}
      KAFKA_PARTITIONS: ${KAFKA_PARTITIONS}
      KAFKA_REPLICATION: ${KAFKA_REPLICATION}
    volumes:
      - ./scripts:/scripts:ro
    restart: "no"
    logging: *default-logging

  # One-shot: create the shared data tree with permissions every service can use.
  #
  # Why this exists (DEFECT-010): the /data volume is created by whichever container touches it
  # first, owned by that container's UID. The three writers run as different users on purpose
  # (producers uid 10001, stream job uid 10002, Airflow uid 50000 — none of them root), so
  # without this step only one of them can write. This container creates the tree once and makes
  # it group/world writable. At production scale the lake would be object storage and this
  # problem would not arise; on a laptop with a shared volume it has to be handled explicitly.
  data-init:
    image: busybox:1.36
    container_name: fleet-data-init
    command:
      - sh
      - -c
      - |
        set -eux
        mkdir -p /data/lake /data/landing /data/processed /data/reports /data/checkpoints /shared
        chmod -R 0777 /data /shared
        ls -la /data
    volumes:
      - appdata:/data
      - shared:/shared
    restart: "no"
    logging: *default-logging

  postgres:
    image: postgres:16-alpine
    container_name: fleet-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Deterministic timestamps everywhere; the whole pipeline works in UTC.
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # *.sql here runs once, on first initialisation, in lexical order.
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 320m
    logging: *default-logging
    restart: unless-stopped

  # ==========================================================================================
  # INGESTION
  # ==========================================================================================
  gps-producer:
    build:
      context: .
      dockerfile: producers/Dockerfile
    image: fleet-producers:1.0
    container_name: fleet-gps-producer
    command: ["python", "-m", "producers.gps_producer"]
    environment:
      <<: *app-env
      SERVICE_NAME: gps-producer
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      data-init:
        condition: service_completed_successfully
    volumes:
      - shared:/shared
      - ./common:/app/common:ro
      - ./producers:/app/producers:ro
    ports:
      - "${PRODUCER_METRICS_PORT}:8001"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if 'producer_events_sent_total' in urllib.request.urlopen('http://localhost:8001/').read().decode() else 1)\""]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s
    mem_limit: 224m
    logging: *default-logging
    restart: unless-stopped

  expense-producer:
    build:
      context: .
      dockerfile: producers/Dockerfile
    image: fleet-producers:1.0
    container_name: fleet-expense-producer
    command: ["python", "-m", "producers.expense_producer"]
    environment:
      <<: *app-env
      SERVICE_NAME: expense-producer
    depends_on:
      kafka:
        condition: service_healthy
      data-init:
        condition: service_completed_successfully
    volumes:
      - shared:/shared
      - appdata:/data
      - ./common:/app/common:ro
      - ./producers:/app/producers:ro
    ports:
      - "${EXPENSE_METRICS_PORT}:8002"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if 'expense_files_written_total' in urllib.request.urlopen('http://localhost:8002/').read().decode() else 1)\""]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s
    mem_limit: 160m
    logging: *default-logging
    restart: unless-stopped

  # ==========================================================================================
  # PROCESSING (speed layer)
  # ==========================================================================================
  stream-job:
    build:
      context: .
      dockerfile: streaming/Dockerfile
    image: fleet-streaming:1.0
    container_name: fleet-stream-job
    command: ["python", "-m", "streaming.stream_job"]
    environment:
      <<: *app-env
      SERVICE_NAME: stream-job
      # Driver heap must stay well under mem_limit or the container gets OOM-killed instead of
      # Spark raising a clean OutOfMemoryError.
      SPARK_DRIVER_MEMORY: 950m
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      data-init:
        condition: service_completed_successfully
    volumes:
      - shared:/shared
      - appdata:/data
      - ./common:/app/common:ro
      - ./streaming:/app/streaming:ro
      - ./batch:/app/batch:ro
    ports:
      - "${STREAM_METRICS_PORT}:8003"
      - "4040:4040"   # Spark UI — useful evidence screenshot for the report
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if 'stream_batches_total' in urllib.request.urlopen('http://localhost:8003/').read().decode() else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    mem_limit: 1500m
    logging: *default-logging
    restart: unless-stopped

  # ==========================================================================================
  # ORCHESTRATION (batch layer)
  # ==========================================================================================
  airflow-init:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    image: fleet-airflow:1.0
    container_name: fleet-airflow-init
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        airflow db migrate
        # DEFECT-011: `airflow db migrate` does NOT seed the default connections (the deprecated
        # `airflow db init` used to). Without fs_default the FileSensor dies in 0.4 s with
        # "The conn_id `fs_default` isn't defined" instead of waiting for the file.
        airflow connections create-default-connections
        airflow users create --username "$${AIRFLOW_ADMIN_USER}" --password "$${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Fleet --lastname Ops --role Admin --email ops@fleet.local || true
        airflow connections get fs_default -o plain
    environment: &airflow-env
      <<: *app-env
      SERVICE_NAME: airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${AIRFLOW_DB}
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
      AIRFLOW__CORE__FERNET_KEY: "z5YkT2s9wQ1n_S0lMnM4Q3GYgVqF7t8ZKX9c1oWpJ2A="
      AIRFLOW__WEBSERVER__SECRET_KEY: "fleet-lambda-demo-secret"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "True"
      AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session"
      AIRFLOW__SCHEDULER__MIN_FILE_PROCESSING_INTERVAL: "15"
      # Airflow defaults to 4 gunicorn workers (~150 MB each). Two is plenty for a demo UI
      # and is what keeps the webserver inside its memory limit on an 8 GB laptop.
      AIRFLOW__WEBSERVER__WORKERS: "1"
      AIRFLOW__WEBSERVER__WORKER_REFRESH_BATCH_SIZE: "0"
      AIRFLOW__SCHEDULER__PARSING_PROCESSES: "1"
      AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      PYTHONPATH: /opt/airflow/project
    depends_on:
      postgres:
        condition: service_healthy
      data-init:
        condition: service_completed_successfully
    volumes:
      - shared:/shared
      - appdata:/data
      - airflowlogs:/opt/airflow/logs
      - ./airflow/dags:/opt/airflow/dags
      - ./common:/opt/airflow/project/common:ro
      - ./batch:/opt/airflow/project/batch:ro
      - ./scripts:/opt/airflow/project/scripts:ro
    restart: "no"
    logging: *default-logging

  airflow-scheduler:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    image: fleet-airflow:1.0
    container_name: fleet-airflow-scheduler
    command: ["scheduler"]
    environment: *airflow-env
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    volumes:
      - shared:/shared
      - appdata:/data
      - airflowlogs:/opt/airflow/logs
      - ./airflow/dags:/opt/airflow/dags
      - ./common:/opt/airflow/project/common:ro
      - ./batch:/opt/airflow/project/batch:ro
      - ./scripts:/opt/airflow/project/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\" || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 60s
    # The scheduler also hosts the spark-submit driver for the profitability job (LocalExecutor
    # runs tasks as child processes), so it needs head-room the webserver does not.
    mem_limit: 1400m
    logging: *default-logging
    restart: unless-stopped

  airflow-webserver:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    image: fleet-airflow:1.0
    container_name: fleet-airflow-webserver
    command: ["webserver"]
    environment: *airflow-env
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    volumes:
      - shared:/shared
      - appdata:/data
      - airflowlogs:/opt/airflow/logs
      - ./airflow/dags:/opt/airflow/dags
      - ./common:/opt/airflow/project/common:ro
      - ./batch:/opt/airflow/project/batch:ro
      - ./scripts:/opt/airflow/project/scripts:ro
    ports:
      - "${AIRFLOW_PORT}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    mem_limit: 900m
    logging: *default-logging
    restart: unless-stopped

  # ==========================================================================================
  # SERVING
  # ==========================================================================================
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: fleet-api:1.0
    container_name: fleet-api
    environment:
      <<: *app-env
      SERVICE_NAME: api
    depends_on:
      postgres:
        condition: service_healthy
      data-init:
        condition: service_completed_successfully
    volumes:
      - shared:/shared
      - appdata:/data
      - ./common:/app/common:ro
      - ./api:/app/api:ro
    ports:
      - "${API_PORT}:8000"
    healthcheck:
      # /health is intentionally used as the container health probe: if Postgres or data
      # freshness degrade, the container is marked unhealthy and shows up in `docker compose ps`.
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health/live || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s
    mem_limit: 224m
    logging: *default-logging
    restart: unless-stopped

  # ==========================================================================================
  # OBSERVABILITY
  # ==========================================================================================
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    container_name: fleet-kafka-exporter
    command: ["--kafka.server=kafka:9092", "--web.listen-address=:9308"]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${KAFKA_EXPORTER_PORT}:9308"
    mem_limit: 96m
    logging: *default-logging
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.3
    container_name: fleet-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=6h
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - promdata:/prometheus
    ports:
      - "${PROMETHEUS_PORT}:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 15s
    mem_limit: 224m
    logging: *default-logging
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    container_name: fleet-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_INSTALL_PLUGINS: ""
      # Substituted into the provisioned Postgres datasource.
      PG_HOST: postgres:5432
      PG_DB: ${POSTGRES_DB}
      PG_USER: ${POSTGRES_USER}
      PG_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 20s
    mem_limit: 224m
    logging: *default-logging
    restart: unless-stopped

  # ==========================================================================================
  # TOOLING (profile "tools": not started by `docker compose up -d`)
  # ==========================================================================================
  tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    image: fleet-tests:1.0
    container_name: fleet-tests
    profiles: ["tools"]
    environment:
      <<: *app-env
      SERVICE_NAME: tests
      API_HOST: api
      PROM_HOST: prometheus
      PROM_PORT: "9090"
      GRAFANA_HOST: grafana
      GRAFANA_PORT: "3000"
      AIRFLOW_HOST: airflow-webserver
      AIRFLOW_WEB_PORT: "8080"
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
    volumes:
      - shared:/shared
      - appdata:/data
      - ./:/app
    working_dir: /app
    mem_limit: 1600m
    logging: *default-logging

volumes:
  # Named volumes rather than host bind mounts for anything Spark writes: Windows/macOS bind
  # mounts do not give POSIX rename semantics, which Structured Streaming checkpoints rely on.
  kafkadata:
  pgdata:
  promdata:
  grafanadata:
  airflowlogs:
  shared:   # /shared/sim_epoch.txt — the pinned simulation epoch
  appdata:  # /data/{lake,landing,processed,reports,checkpoints}

networks:
  default:
    name: fleet-net
